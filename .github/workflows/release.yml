# Cut a release whenever a new tag is pushed to the repo.
# You should use an annotated tag, like `git tag -a v1.2.3`
# and put the release notes into the commit message for the tag.
name: Release

on:
  push:
    tags:
      - "*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - uses: bazelbuild/setup-bazelisk@v1
      - name: Check git state is clean
        run: git status --porcelain
      - name: Export release version
        run: 'echo "RELEASE_VERSION=${GITHUB_REF##*/}" >> $GITHUB_ENV'
      - name: Build release archive
        env:
          # Bazelisk will download bazel to here
          XDG_CACHE_HOME: ~/.cache/bazel-repo
        run: bazel --bazelrc=.github/workflows/ci.bazelrc --bazelrc=.bazelrc build //:rules_kubeconform
      - name: Set versioned archive name
        run: cp bazel-bin/rules_kubeconform.tar.gz bazel-bin/rules_kubeconform-${{ env.RELEASE_VERSION }}.tar.gz
      - name: Export archive integrity
        run: 'echo "RELEASE_INTEGRITY=sha256-$(openssl dgst -sha256 -binary bazel-bin/rules_kubeconform-${{ env.RELEASE_VERSION }}.tar.gz | openssl base64 -A)" >> "$GITHUB_ENV"'
      - name: Upload release
        uses: softprops/action-gh-release@v1
        with:
          files: bazel-bin/rules_kubeconform-${{ env.RELEASE_VERSION }}.tar.gz
          fail_on_unmatched_files: true
          body: |
            ```starlark
            bazel_dep(name = "rules_kubeconform", version = "${{ env.RELEASE_VERSION }}")
            archive_override(
                module_name = "rules_kubeconform",
                integrity = "${{ env.RELEASE_INTEGRITY }}",
                urls = ["https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_VERSION }}/rules_kubeconform-${{ env.RELEASE_VERSION }}.tar.gz"],
            )
            ```
