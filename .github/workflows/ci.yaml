name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # An empty override lets Bazelisk use .bazelversion in each workspace.
        bazel: ['9.1.0', '']
    runs-on: ${{ matrix.os }}
    name: test-on-${{ matrix.os }}-with-bazel-${{ matrix.bazel || 'pinned' }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          # Older Bazel cannot read the pinned version's lockfile format.
          bazelrc: |
            common --lockfile_mode=${{ matrix.bazel == '' && 'error' || 'off' }}
            test --test_output=errors
      - run: bazel test //...
      - name: Test example consumer
        working-directory: example
        run: bazel test //...
